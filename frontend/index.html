<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eef2f3, #824a7f);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: #561b5e;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .content {
            max-width: 600px;
        }

        .content h1 {
            font-size: 32px;
            color: #6a0781;
            margin-bottom: 10px;
        }

        .content p {
            font-size: 18px;
            color: #260130;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            background: #661175;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #a875aa;
        }

        .admin {
            background: #661175;
        }

        .admin:hover {
            background: #a875aa;
        }

        footer {
            background: #3c0947ce;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
         CampusEvent Hub
    </header>

    <div class="container">
        <div class="content">
            <h1>Welcome to the Ultimate Event Experience 🎉</h1>
            <p>
                Choose your role to continue. Students can register for events,
                while admins can manage registrations and events.
            </p>

            <div class="btn-group">
                <a href="student.html" class="btn">Student Login</a>
                <a href="admin.html" class="btn admin">Admin Login</a>
            </div>
        </div>
    </div>

    <footer>
        © 2026 College Event Hub. All Rights Reserved.
    </footer>

</body>
</html>
