<!DOCTYPE html>
<html>
<head>
    <title>CampusEvent Hub</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eef2f3, #824a7f);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #561b5e;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 500px;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        h1 {
            color: #561b5e;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        button {
            background: #561b5e;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #983fb9;
        }

        footer {
            background: #44154a;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 14px;
        }

    </style>

</head>

<body>

<header>
    CampusEvent Hub
</header>

<main>

    <div class="container">

        <h1>Welcome to CampusEvent Hub</h1>

        <p>
            Explore. Register. Participate.
            Make every campus event count.
        </p>

        <button onclick="window.location.href='login.html'">
            Get Started
        </button>

    </div>

</main>

<footer>
    © 2026 College Event Hub. All Rights Reserved.
</footer>

</body>
</html>
